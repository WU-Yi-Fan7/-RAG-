# 应用服务 WEB 访问端口
server.port=8088
# 后端服务的访问地址
server.servlet.context-path=/ycw
server.address = 0.0.0.0
# 在springboot项目中默认数据库连接池使用的是HikariCP（翻译为闪电）
# 配置数据库连接信息
# 简化版数据库配置
spring.datasource.url=jdbc:mysql://localhost/activities_school?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#下面这些内容是为了让MyBatis映射
#指定Mybatis的实体目录
mybatis-plus.type-aliases-package=cn.edu.hubu.hubuactivities.entity
#取消驼峰转下划线
mybatis-plus.configuration.map-underscore-to-camel-case=false
# 将MyBatis的日志打印到控制台
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt.secret=hubu-activity-system-secret-key-2024-spring-boot-jwt
jwt.expiration=7200000
jwt.refreshExpiration=604800000

# 日志级别
logging.level.cn.edu.hubu.hubuactivities=debug

# redis配置
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
# 设置连接超时
spring.redis.timeout=3000ms

zhipu.api-key=